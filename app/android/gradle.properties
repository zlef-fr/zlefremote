# Memory-bounded Gradle. The Flutter template ships -Xmx8G/-XX:MaxMetaspaceSize=4G,
# which on this host let the daemon reach ~4.8 GB RSS and got it SIGTERM'd by
# earlyoom mid-build ("Gradle build daemon disappeared unexpectedly"). These are
# the values the other Flutter apps on this machine build with.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
